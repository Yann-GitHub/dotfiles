#
# ~/.config/starship.toml
#

# Do not print a blank line between commands
add_newline = false

# Display order of elements in your prompt
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$line_break\
$character"""

[username]
disabled = true
style_user = 'cyan'
style_root = 'red bold'
format = "[$user]($style) "
aliases = { "yann" = "LoGodeN", "pi" = "MiniBoyUser", "debian" = "Muaddib" }

[hostname]
ssh_only = true
ssh_symbol = ""
style = "bright-black"
aliases = { "homelab" = "MiniBoy", "vps-8d403117" = "Arrakis", "home" = "Home" }
format = "[$ssh_symbol$hostname]($style) "

# Input cursor configuration
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](purple)"

# Current directory configuration
[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "blue"
format = "[$path]($style)"
read_only = " 🔒"

# Git branch configuration
[git_branch]
symbol = " "
style = "bright-black"
format = " on [$symbol$branch]($style) "

# Git status configuration
[git_status]
style = "cyan"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# Node.js
[nodejs]
format = "via [⬢ $version](bright-black) "
# Uncomment only if you want to hide Node.js:
# disabled = true

# Disable python module to stay minimalist
[python]
disabled = true
